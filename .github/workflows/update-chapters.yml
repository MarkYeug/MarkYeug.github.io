name: Update chapter list
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: update-chapters
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Fetch chapters (plain request)
        id: plain
        continue-on-error: true
        run: node scripts/update-chapters.mjs
      - name: Fetch chapters (headless browser fallback)
        if: steps.plain.outcome == 'failure'
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          node scripts/update-chapters.mjs
        env: { MODE: browser }
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- argus/data/chapters.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add argus/data/chapters.json
          git commit -m "Update chapter list"
          git reset --hard HEAD
          git clean -fd node_modules
          git pull --rebase && git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Send email only on chapter data change
        if: steps.commit.outputs.changed == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EMAIL_TO: fabusunyow@gmail.com
          EMAIL_SUBJECT: "Argus chapter data updated: {chapter_title}"
          EMAIL_TEXT: "The generated chapter data changed. The latest chapter is {chapter_title}.\nURL: {chapter_url}"
          CHAPTERS_PATH: argus/data/chapters.json
        run: node scripts/send-update-email.mjs

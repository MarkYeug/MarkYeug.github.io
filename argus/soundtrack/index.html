<!doctype html><html lang=en><head><title>Soundtrack | Argus Directorates</title><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=robots content=noindex><meta name=referrer content=strict-origin-when-cross-origin><link rel=icon href=../../assets/missing-texture.svg><link href="https://fonts.googleapis.com/css2?family=Tektur:wght@500;700&family=Spectral:ital,wght@0,400;0,600;1,400&family=UnifrakturCook:wght@700&display=swap" rel=stylesheet><link rel=stylesheet href=../../assets/style.css></head>
<body>
<header><div class=wrap><a class=logo href=../../argus/>ARGUS DIRECTORATES</a><nav class=nav><a href=../../home/>Home</a><a href=../../argus/>Argus Directorates</a><a href=../../phobia/>PHOBO—PHOBIA</a><a href=../../argus/chapters/>Chapters</a><a href=../../argus/world/>World</a></nav></div></header>
<main class=wrap><h1>Soundtrack</h1><p class=tag id=note>Loops until you close the tab.</p><div class=sound-frame id=frame></div><p><a id=yt rel="noopener noreferrer">Open on YouTube</a> &middot; <a href=../chapters/>Back to chapters</a></p></main>
<footer><div class=wrap>A light novel by Mark Yeug &middot; <a href=../../home/>&copy; Mark Yeug</a></div></footer>
<script>
(()=>{const id=new URLSearchParams(location.search).get('v')||'',f=document.getElementById('frame');
if(!/^[\w-]{11}$/.test(id)){f.remove();document.getElementById('yt').remove();document.getElementById('note').textContent='No soundtrack selected.';return}
const i=document.createElement('iframe');i.title='Chapter soundtrack';i.allow='autoplay; encrypted-media; picture-in-picture';i.allowFullscreen=true;
i.src='https://www.youtube.com/embed/'+id+'?autoplay=1&loop=1&playlist='+id+'&rel=0';f.append(i);
document.getElementById('yt').href='https://www.youtube.com/watch?v='+id})();
</script></body></html>

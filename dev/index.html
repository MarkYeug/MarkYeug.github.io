<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Dev Console | Mark Yeug</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" href="../assets/missing-texture.svg">
    <link href="https://fonts.googleapis.com/css2?family=Tektur:wght@500;700&family=Spectral:ital,wght@0,400;0,600;1,400&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/style.css">
  </head>
  <body class="dev-page">
    <main class="wrap">
      <section class="dev-shell" aria-live="polite">
        <h1 class="name">Dev Console</h1>
        <label class="sr-only" for="dev-input">Command input</label>
        <div class="dev-form">
          <input id="dev-input" type="text" spellcheck="false" placeholder="Type a command..." autocomplete="off">
          <button type="button" id="dev-submit">Run</button>
        </div>
        <div id="dev-status" class="dev-status" aria-live="polite">Ready.</div>
        <section id="snake-game" class="snake-game" hidden aria-label="Snake game">
          <div class="snake-head"><h2>Snake</h2><button type="button" id="snake-close">Close</button></div>
          <canvas id="snake-canvas" width="400" height="400" aria-label="Snake game board"></canvas>
          <p id="snake-score">Score: 0</p>
          <div class="snake-controls" aria-label="Snake controls">
            <button type="button" data-direction="up">Up</button>
            <div><button type="button" data-direction="left">Left</button><button type="button" data-direction="down">Down</button><button type="button" data-direction="right">Right</button></div>
          </div>
        </section>
      </section>
    </main>
    <script>
      const statusEl = document.getElementById('dev-status');
      const inputEl = document.getElementById('dev-input');
      const snakeGame = document.getElementById('snake-game');
      const snakeCanvas = document.getElementById('snake-canvas');
      const snakeScore = document.getElementById('snake-score');
      const snakeContext = snakeCanvas.getContext('2d');
      const snakeSize = 20;
      let snakeTimer = null;
      let snakeState = null;
      let refreshTimer = null;
      const drawSnake = () => {
        if (!snakeState) return;
        snakeContext.fillStyle = '#111'; snakeContext.fillRect(0, 0, snakeCanvas.width, snakeCanvas.height);
        snakeContext.strokeStyle = '#292424';
        for (let line = 0; line <= snakeCanvas.width; line += snakeSize) { snakeContext.beginPath(); snakeContext.moveTo(line, 0); snakeContext.lineTo(line, snakeCanvas.height); snakeContext.stroke(); snakeContext.beginPath(); snakeContext.moveTo(0, line); snakeContext.lineTo(snakeCanvas.width, line); snakeContext.stroke(); }
        snakeContext.fillStyle = '#eee'; snakeState.snake.forEach(part => snakeContext.fillRect(part.x * snakeSize + 2, part.y * snakeSize + 2, snakeSize - 4, snakeSize - 4));
        snakeContext.fillStyle = '#999'; snakeContext.fillRect(snakeState.food.x * snakeSize + 5, snakeState.food.y * snakeSize + 5, snakeSize - 10, snakeSize - 10);
      };
      const setSnakeDirection = direction => { if (!snakeState) return; const opposites = {up:'down',down:'up',left:'right',right:'left'}; if (opposites[direction] !== snakeState.direction) snakeState.nextDirection = direction; };
      const placeFood = () => { let food; do { food = {x:Math.floor(Math.random()*20), y:Math.floor(Math.random()*20)}; } while (snakeState.snake.some(part => part.x === food.x && part.y === food.y)); snakeState.food = food; };
      const stepSnake = () => { const direction = snakeState.nextDirection; snakeState.direction = direction; const head = {...snakeState.snake[0]}; if (direction === 'up') head.y--; if (direction === 'down') head.y++; if (direction === 'left') head.x--; if (direction === 'right') head.x++; const hitWall = head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20; const hitSelf = snakeState.snake.some(part => part.x === head.x && part.y === head.y); if (hitWall || hitSelf) { clearInterval(snakeTimer); snakeTimer = null; statusEl.textContent = 'Snake ended. Type *#snake to restart.'; return; } snakeState.snake.unshift(head); if (head.x === snakeState.food.x && head.y === snakeState.food.y) { snakeState.score++; placeFood(); } else snakeState.snake.pop(); snakeScore.textContent = `Score: ${snakeState.score}`; drawSnake(); };
      const startSnake = () => { clearInterval(snakeTimer); snakeGame.hidden = false; snakeState = {snake:[{x:10,y:10},{x:9,y:10},{x:8,y:10}],direction:'right',nextDirection:'right',food:{x:15,y:10},score:0}; snakeScore.textContent = 'Score: 0'; drawSnake(); snakeTimer = setInterval(stepSnake, 130); inputEl.blur(); };
      const refreshCountdown = () => { const now = new Date(); const parts = Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'America/Anchorage',weekday:'short',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(now).filter(part => part.type !== 'literal').map(part => [part.type, part.value])); const day = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(parts.weekday); const hour = Number(parts.hour), minute = Number(parts.minute), second = Number(parts.second); const current = hour * 60 + minute; const currentCadence = day === 1 || day === 5 ? 45 : 90; if (second === 0 && current % currentCadence === 0) return 'Next chapter refresh in 0h 0m 0s (Alaska time)'; for (let offset = 1; offset <= 180; offset++) { const candidate = current + offset; const candidateDay = (day + Math.floor(candidate / 1440)) % 7; const cadence = candidateDay === 1 || candidateDay === 5 ? 45 : 90; if (candidate % cadence === 0) { const totalSeconds = offset * 60 - second; const hours = Math.floor(totalSeconds / 3600); const minutes = Math.floor((totalSeconds % 3600) / 60); const seconds = totalSeconds % 60; return `Next chapter refresh in ${hours}h ${minutes}m ${seconds}s (Alaska time)`; } } return 'Next chapter refresh is being calculated.'; };
      const startRefreshCountdown = () => { clearInterval(refreshTimer); let last = ''; const update = () => { const text = refreshCountdown(); statusEl.className = 'dev-status ok'; statusEl.textContent = text; if (last && text.startsWith('Next chapter refresh in 0h 0m 0s')) statusEl.textContent = 'Refresh window reached. GitHub Actions may take a moment to publish the new chapter data.'; last = text; }; update(); refreshTimer = setInterval(update, 1000); };
      document.getElementById('snake-close').addEventListener('click', () => { clearInterval(snakeTimer); snakeTimer = null; snakeGame.hidden = true; inputEl.focus(); });
      document.querySelectorAll('[data-direction]').forEach(button => button.addEventListener('click', () => setSnakeDirection(button.dataset.direction)));
      document.addEventListener('keydown', event => { const keys = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}; if (keys[event.key]) { event.preventDefault(); setSnakeDirection(keys[event.key]); } });
      const submit = async () => {
        const raw = (inputEl.value || '').trim();
        if (!raw) {
          statusEl.textContent = 'No command entered.';
          statusEl.className = 'dev-status bad';
          return;
        }

        const run = async () => {
          if (raw === '*#snake') { startSnake(); return 'Snake started.'; }
          if (raw.toLowerCase() === 'when') { startRefreshCountdown(); return refreshCountdown(); }
          if (raw === '*#refresh') {
            const src = '../argus/data/chapters.json?ts=' + Date.now();
            const res = await fetch(src, { cache: 'no-cache' });
            if (!res.ok) throw new Error('chapter refresh failed');
            const data = await res.json();
            if (!Array.isArray(data.volumes) || !data.volumes.length) throw new Error('invalid chapter data');
            if (window.refreshArgusChapters) {
              const last = await window.refreshArgusChapters(src);
              return `Chapter data refreshed. Latest: ${last.n}: ${last.title}`;
            }
            return 'Chapter data refreshed.';
          }

          if (raw === '*#send') {
            let latest = 'No chapter data is currently loaded.';
            if (window.refreshArgusChapters) {
              const data = await fetch('../argus/data/chapters.json?ts=' + Date.now(), { cache: 'no-cache' }).then(r => r.json());
              const volumes = Array.isArray(data.volumes) ? data.volumes : [];
              const last = volumes.length ? volumes[volumes.length - 1].chapters.slice(-1)[0] : null;
              if (last) latest = `Chapter ${last.n}: ${last.title}\nURL: ${last.url}`;
            }
            const subject = encodeURIComponent('Argus Directorates chapter update');
            const body = encodeURIComponent(latest);
            window.location.href = `mailto:fabusunyow@gmail.com?subject=${subject}&body=${body}`;
            return 'Opening your mail client with the latest chapter data attached.';
          }

          throw new Error('Unknown command');
        };

        try {
          statusEl.className = 'dev-status';
          statusEl.textContent = 'Running...';
          const response = await run();
          statusEl.className = 'dev-status ok';
          statusEl.textContent = response;
        } catch (error) {
          statusEl.className = 'dev-status bad';
          statusEl.textContent = 'Command failed: ' + (error && error.message ? error.message : 'unknown error');
        }
      };

      document.getElementById('dev-submit').addEventListener('click', submit);
      inputEl.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          submit();
        }
      });
      inputEl.focus();
    </script>
  </body>
</html>
